name: Codex and JavaScript regressions

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Codex session and auth tests
        run: python -m unittest discover -s tests -p 'test_codex*.py' -v
      - name: Live director and anti-loop tests
        run: |
          python -m unittest discover -s tests -p 'test_ai_director.py' -v
          python -m unittest discover -s tests -p 'test_director_boundaries.py' -v
      - name: Engine controller and social routing tests
        run: |
          python -m unittest discover -s tests -p 'test_engine_controller.py' -v
          python -m unittest discover -s tests -p 'test_engine_fuzz.py' -v
      - name: JavaScript regressions
        shell: bash
        run: |
          mapfile -t test_files < <(find tests -maxdepth 1 -type f -name '*.js' ! -name 'test_dashboard_layout.js' | sort)
          node --test "${test_files[@]}"
